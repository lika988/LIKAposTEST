<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIKApos - Redirecting...</title>
    <style>
        body { background-color: #1A1D23; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #252A34; border-top: 4px solid #00D4FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        // Configuration
        const MOBILE_LIMIT = 768;  // Phones
        const TABLET_LIMIT = 1024; // iPads/Tablets

        function detectAndRedirect() {
            const width = window.innerWidth;
            
            // We use location.replace() so the user can't press "Back" to return to the redirect page
            if (width <= MOBILE_LIMIT) {
                window.location.replace("mobile.html");
            } else if (width <= TABLET_LIMIT) {
                window.location.replace("tablet.html");
            } else {
                window.location.replace("desktop.html");
            }
        }

        // Run immediately
        detectAndRedirect();
    </script>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader" style="margin: 0 auto 20px auto;"></div>
        <div>Loading LIKApos...</div>
    </div>
</body>
</html>
