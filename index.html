<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIKApos - Loading...</title>
    
    <style>
        body { 
            background-color: #030712; /* Matches your Desktop Dark Theme */
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .loader { 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid #6366f1; /* Indigo Primary */
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 0.8s linear infinite; 
            margin-bottom: 20px;
        }
        .text {
            font-size: 14px;
            color: #9ca3af;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
        function detectAndRedirect() {
            const width = window.innerWidth;
            
            // 1. MOBILE: Phones (Width <= 768px)
            if (width <= 768) {
                // Prevents back-button loops by replacing current history entry
                window.location.replace("mobile.html");
            } 
            // 2. TABLET: iPads/Tablets (Width between 769px and 1024px)
            else if (width <= 1024) {
                window.location.replace("tablet.html");
            } 
            // 3. DESKTOP: Laptops/Monitors (Width > 1024px)
            else {
                window.location.replace("desktop.html");
            }
        }

        // Execute immediately before the page fully paints
        detectAndRedirect();

        // Optional: Listen for resize (in case user rotates tablet or resizes desktop window)
        // We usually don't auto-redirect on resize to prevent losing unsaved work, 
        // but if you want strict enforcement, uncomment the line below:
        // window.addEventListener('resize', detectAndRedirect);
    </script>
</head>
<body>
    <div class="loader"></div>
    <div class="text">Loading LIKApos...</div>
</body>
</html>
